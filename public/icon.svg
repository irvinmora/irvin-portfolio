<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fondo radial para profundidad -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#090c09"/>
      <stop offset="100%" stop-color="#030403"/>
    </radialGradient>
    <!-- Gradiente verde neón brillante -->
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <!-- Filtro de resplandor neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo de fondo con borde neón -->
  <circle cx="256" cy="256" r="236" fill="url(#bg-glow)" stroke="url(#neon-green)" stroke-width="12" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Símbolos de código (< />) con efecto neón brillante -->
  <g filter="url(#glow)">
    <!-- Etiqueta abrir (<) -->
    <path d="M 180,160 L 90,256 L 180,352" 
          fill="none" 
          stroke="url(#neon-green)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Etiqueta cerrar (>) -->
    <path d="M 332,160 L 422,256 L 332,352" 
          fill="none" 
          stroke="url(#neon-green)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Barra diagonal (/) -->
    <path d="M 280,130 L 232,382" 
          fill="none" 
          stroke="url(#neon-green)" 
          stroke-width="28" 
          stroke-linecap="round" />
  </g>
</svg>
